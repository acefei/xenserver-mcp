name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run ruff format check
        run: uv run ruff format . --check

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run unit tests
        run: uv run pytest tests/ -v --ignore=tests/integration/
        env:
          # Integration tests are skipped by default in CI
          # They require real XCP-ng environment and credentials
          XENSERVER_INTEGRATION: "0"

      - name: Generate coverage report
        run: uv run pytest tests/ --cov=src/xenserver_mcp --cov-report=term-missing --ignore=tests/integration/
        if: always()
